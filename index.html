<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BUNEXA — Money Butler</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#08090c;
  color:#f5f5f5;
  min-height:100vh;
}
.app{
  max-width:520px;
  margin:auto;
  padding:28px 20px 110px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:32px;
}
.logo{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
}
.menu{
  width:44px;
  height:44px;
  border:1px solid #292d35;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}
.greeting{
  color:#8f96a3;
  font-size:14px;
  margin-bottom:8px;
}
.title{
  font-size:30px;
  font-weight:700;
  margin-bottom:22px;
}
.balance{
  background:linear-gradient(145deg,#181b22,#101217);
  border:1px solid #292d35;
  border-radius:24px;
  padding:24px;
  margin-bottom:18px;
}
.balance-label{
  color:#949aa6;
  font-size:14px;
}
.amount{
  font-size:38px;
  font-weight:750;
  margin:8px 0 22px;
  letter-spacing:-1px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.stat{
  background:#0d0f13;
  border:1px solid #252932;
  border-radius:16px;
  padding:15px;
}
.stat-label{
  color:#858c99;
  font-size:12px;
  margin-bottom:7px;
}
.stat-value{
  font-size:17px;
  font-weight:650;
}
.income{color:#5ee6a8}
.expense{color:#ff7272}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 0 14px;
}
.section h2{
  font-size:19px;
}
.section span{
  color:#8d94a0;
  font-size:13px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.action{
  border:1px solid #292d35;
  background:#111319;
  border-radius:18px;
  padding:20px 14px;
  color:#fff;
  text-align:left;
  font-size:15px;
}
.action strong{
  display:block;
  font-size:25px;
  margin-bottom:8px;
}
.action small{
  color:#858c98;
}

.transactions{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.transaction{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#111319;
  border:1px solid #252932;
  border-radius:17px;
  padding:15px;
}
.left{
  display:flex;
  align-items:center;
  gap:12px;
}
.icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#1d2028;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}
.name{
  font-weight:600;
  font-size:14px;
}
.date{
  color:#777e8a;
  font-size:11px;
  margin-top:4px;
}
.money{
  font-weight:700;
  font-size:14px;
}

.nav{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,calc(100% - 28px));
  background:rgba(20,22,28,.96);
  border:1px solid #30343d;
  border-radius:24px;
  padding:9px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  backdrop-filter:blur(18px);
}
.nav button{
  background:transparent;
  border:0;
  color:#818894;
  padding:9px 4px;
  border-radius:16px;
  font-size:11px;
}
.nav button:first-child{
  background:#292d35;
  color:#fff;
}
.nav-icon{
  display:block;
  font-size:19px;
  margin-bottom:3px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  align-items:flex-end;
  justify-content:center;
  padding:15px;
}
.modal-box{
  width:min(500px,100%);
  background:#15171d;
  border:1px solid #30343d;
  border-radius:25px;
  padding:24px;
}
.modal-box h2{
  margin-bottom:20px;
}
input,select{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  background:#0c0e12;
  color:#fff;
  border:1px solid #30343d;
  border-radius:14px;
  font-size:15px;
}
.save{
  width:100%;
  padding:15px;
  border:0;
  border-radius:15px;
  background:#fff;
  color:#08090c;
  font-weight:700;
  font-size:15px;
}
.close{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:0;
  background:transparent;
  color:#999;
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="logo">BUNEXA</div>
    <div class="menu">☰</div>
  </div>

  <div class="greeting">YOUR PERSONAL MONEY BUTLER</div>
  <div class="title">Good evening 👋</div>

  <div class="balance">
    <div class="balance-label">Total Balance</div>
    <div class="amount" id="balance">$0.00</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">INCOME</div>
        <div class="stat-value income" id="income">$0.00</div>
      </div>

      <div class="stat">
        <div class="stat-label">EXPENSES</div>
        <div class="stat-value expense" id="expense">$0.00</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Quick actions</h2>
    <span>Manage money</span>
  </div>

  <div class="actions">
    <button class="action" onclick="openModal('income')">
      <strong>＋</strong>
      Add income
      <small>Record money in</small>
    </button>

    <button class="action" onclick="openModal('expense')">
      <strong>−</strong>
      Add expense
      <small>Record money out</small>
    </button>
  </div>

  <div class="section">
    <h2>Recent transactions</h2>
    <span id="count">0 items</span>
  </div>

  <div class="transactions" id="transactions">
    <div class="transaction">
      <div class="left">
        <div class="icon">💰</div>
        <div>
          <div class="name">No transactions yet</div>
          <div class="date">Add your first transaction</div>
        </div>
      </div>
      <div class="money">—</div>
    </div>
  </div>

</div>

<div class="nav">
  <button>
    <span class="nav-icon">⌂</span>
    Home
  </button>
  <button onclick="openModal('expense')">
    <span class="nav-icon">＋</span>
    Add
  </button>
  <button>
    <span class="nav-icon">◴</span>
    Reports
  </button>
  <button>
    <span class="nav-icon">⚙</span>
    Settings
  </button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Add transaction</h2>

    <input id="description" placeholder="Description">

    <input id="amount" type="number" step="0.01" placeholder="Amount">

    <select id="category">
      <option>Food</option>
      <option>Transport</option>
      <option>Shopping</option>
      <option>Bills</option>
      <option>Salary</option>
      <option>Other</option>
    </select>

    <button class="save" onclick="saveTransaction()">Save transaction</button>
    <button class="close" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
let transactions =
  JSON.parse(localStorage.getItem("bunexa_transactions") || "[]");

let currentType = "expense";

function openModal(type){
  currentType = type;
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalTitle").textContent =
    type === "income" ? "Add income" : "Add expense";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

function saveTransaction(){

  const description =
    document.getElementById("description").value.trim();

  const amount =
    parseFloat(document.getElementById("amount").value);

  const category =
    document.getElementById("category").value;

  if(!description || !amount || amount <= 0){
    alert("Please enter a description and valid amount.");
    return;
  }

  transactions.unshift({
    type:currentType,
    description,
    amount,
    category,
    date:new Date().toLocaleDateString()
  });

  localStorage.setItem(
    "bunexa_transactions",
    JSON.stringify(transactions)
  );

  document.getElementById("description").value = "";
  document.getElementById("amount").value = "";

  closeModal();
  render();
}

function render(){

  let income = 0;
  let expense = 0;

  transactions.forEach(t=>{
    if(t.type === "income") income += t.amount;
    else expense += t.amount;
  });

  document.getElementById("income").textContent =
    "$" + income.toFixed(2);

  document.getElementById("expense").textContent =
    "$" + expense.toFixed(2);

  document.getElementById("balance").textContent =
    "$" + (income-expense).toFixed(2);

  document.getElementById("count").textContent =
    transactions.length + " items";

  const box = document.getElementById("transactions");

  if(transactions.length === 0){
    box.innerHTML = `
      <div class="transaction">
        <div class="left">
          <div class="icon">💰</div>
          <div>
            <div class="name">No transactions yet</div>
            <div class="date">Add your first transaction</div>
          </div>
        </div>
        <div class="money">—</div>
      </div>`;
    return;
  }

  box.innerHTML = transactions.slice(0,10).map(t=>`
    <div class="transaction">
      <div class="left">
        <div class="icon">
          ${t.type === "income" ? "💰" : "🛍️"}
        </div>
        <div>
          <div class="name">${t.description}</div>
          <div class="date">${t.category} · ${t.date}</div>
        </div>
      </div>
      <div class="money ${t.type}">
        ${t.type === "income" ? "+" : "-"}$${t.amount.toFixed(2)}
      </div>
    </div>
  `).join("");
}

render();
</script>

</body>
</html>
