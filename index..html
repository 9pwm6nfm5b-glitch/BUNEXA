function smartParse(text){
  text=String(text||'').trim();
  if(!text)return {amount:'',description:''};

  const cleanAmount=v=>String(v).replace(/,/g,'');
  const moneyAtStart=/^(?:S\$|\$|RM|MYR)?\s*(\d+(?:[.,]\d{1,2})?)\s+(.+)$/i;
  const moneyAtEnd=/^(.+?)\s+(?:S\$|\$|RM|MYR)?\s*(\d+(?:[.,]\d{1,2})?)$/i;
  const currency=/^(?:S\$|\$|RM|MYR)\s*(\d+(?:[.,]\d{1,2})?)\s+(.+)$/i;
  let m=text.match(currency);
  if(m)return {amount:cleanAmount(m[1]).replace(',','.'),description:m[2].trim()};
  m=text.match(moneyAtStart);
  if(m)return {amount:cleanAmount(m[1]).replace(',','.'),description:m[2].trim()};
  m=text.match(moneyAtEnd);
  if(m)return {amount:cleanAmount(m[2]).replace(',','.'),description:m[1].trim()};

  // Also understand compact entries such as "kopi 8.5" or "8.5kopi".
  const compact=/^(.+?)[, ]+(\d+(?:\.\d{1,2})?)$/i.exec(text);
  if(compact)return {amount:compact[2],description:compact[1].trim()};
  const attached=/^(\d+(?:\.\d{1,2})?)([a-zA-Z][a-zA-Z &.'-]+)$/i.exec(text);
  if(attached)return {amount:attached[1],description:attached[2].trim()};

  return {amount:'',description:text};
}

  const now=new Date(),last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),remaining=Math.max(1,last-now.getDate()+1);
  const daily=document.getElementById('safeDaily');
  if(daily)daily.textContent=data.lang==='zh'?`${money(safeValue/remaining)} / 天 · 剩余 ${remaining} 天`:`${money(safeValue/remaining)} / day · ${remaining} days left`;
  let r=txSorted().slice(0,6);document.getElementById('recent').innerHTML=r.length?r.map(x=>`<div class="tx" data-edit="${data.tx.indexOf(x)}"><div class="tx-icon">${x.type==='income'?'💰':icon(x.category)}</div><div class="tx-main"><b>${esc(x.description)}</b><div class="small">${label(x.category)} · ${x.date===dateKey(new Date())?tr('today'):x.date}</div></div><div class="amount ${x.type}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`).join(''):`<div class="empty">${tr('empty')}</div>`}
function renderReports(){let items=period==='month'?data.tx.filter(x=>String(x.date).slice(0,7)===dateKey(new Date()).slice(0,7)):data.tx;let t=totals(items);document.getElementById('rIncome').textContent=money(t.inc);document.getElementById('rExpenses').textContent=money(t.exp);let map={};items.filter(x=>x.type==='expense').forEach(x=>map[x.category]=(map[x.category]||0)+x.amount);let arr=Object.entries(map).sort((a,b)=>b[1]-a[1]);let totalExp=arr.reduce((a,[,v])=>a+v,0);let palette=['#11aeb0','#64748b','#f59e0b','#a78bfa','#ef6b73','#18a66b','#d97706'];let angle=0;let stops=arr.slice(0,7).map(([c,v],i)=>{let a=angle;angle+=totalExp?v/totalExp*360:0;return `${palette[i%palette.length]} ${a}deg ${angle}deg`}).join(',');document.getElementById('donut').style.background=stops?`conic-gradient(${stops})`:'conic-gradient(var(--bg) 0 360deg)';document.getElementById('donutText').innerHTML=money(t.exp)+'<br><span class="small">'+tr('expenses')+'</span>';let max=arr[0]?.[1]||1;document.getElementById('breakdown').innerHTML=arr.length?arr.slice(0,7).map(([c,v])=>`<div class="bar"><div class="bar-top"><span>${icon(c)} ${label(c)}</span><b>${money(v)}</b></div><div class="track"><i style="width:${v/max*100}%"></i></div></div>`).join(''):`<div class="empty">${tr('noSpending')}</div>`;document.getElementById('insight').textContent=arr.length?`${tr('top')}: ${label(arr[0][0])} · ${money(arr[0][1])}`:tr('insightNone');document.querySelectorAll('[data-period]').forEach(b=>b.classList.toggle('active',b.dataset.period===period))}
function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth();document.getElementById('monthTitle').textContent=new Date(y,m,1).toLocaleDateString(data.lang==='zh'?'zh-CN':'en-SG',{month:'long',year:'numeric'});let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((x,i)=>`<div class="dow">${data.lang==='zh'?['日','一','二','三','四','五','六'][i]:x}</div>`).join('');for(let i=0;i<first;i++)html+=`<div></div>`;for(let d=1;d<=days;d++){let k=dateKey(new Date(y,m,d)),sum=data.tx.filter(x=>x.date===k&&x.type==='expense').reduce((a,x)=>a+Number(x.amount),0);html+=`<button class="day ${k===dateKey(selectedDate)?'selected':''}" type="button" data-day="${k}"><strong>${d}</strong>${sum?`<span class="spend">−${money(sum)}</span>`:''}</button>`}document.getElementById('cal').innerHTML=html;renderSelected()}
function renderSelected(){let k=dateKey(selectedDate),items=data.tx.filter(x=>x.date===k);document.getElementById('selectedTitle').textContent=new Date(k+'T00:00:00').toLocaleDateString(data.lang==='zh'?'zh-CN':'en-SG',{month:'long',day:'numeric',year:'numeric'});document.getElementById('selectedList').innerHTML=items.length?items.map(x=>`<div class="tx" data-edit="${data.tx.indexOf(x)}"><div class="tx-icon">${x.type==='income'?'💰':icon(x.category)}</div><div class="tx-main"><b>${esc(x.description)}</b><div class="small">${label(x.category)}</div></div><div class="amount ${x.type}">${x.type==='income'?'+':'−'}${money(x.amount)}</div></div>`).join(''):`<div class="empty">${tr('empty')}</div>`}
function renderSettings(){document.getElementById('currency').value=data.currency;document.getElementById('regular').value=data.regular||'';document.getElementById('fixed').value=data.fixed||'';document.getElementById('language').textContent=data.lang==='en'?'中文':'English';document.getElementById('theme').textContent=data.dark?(data.lang==='zh'?'☀ 浅色':'☀ Light'):(data.lang==='zh'?'🌙 深色':'🌙 Dark');document.documentElement.classList.toggle('dark',data.dark);document.body.classList.toggle('dark',data.dark);document.querySelector('meta[name=theme-color]')?.setAttribute('content',data.dark?'#101214':'#ffffff')}function renderText(){document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.documentElement.lang=data.lang==='zh'?'zh':'en'}function renderAll(){renderText();renderHome();renderReports();renderCalendar();renderSettings()}function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='calendar')renderCalendar();if(p==='reports')renderReports()}

document.addEventListener('click',e=>{if(e.target.closest('.modal') && !e.target.closest('[data-action]'))return;let p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}let edit=e.target.closest('[data-edit]');if(edit){openRecord(Number(edit.dataset.edit));return}let day=e.target.closest('[data-day]');if(day){selectedDate=new Date(day.dataset.day+'T00:00:00');renderCalendar();return}let per=e.target.closest('[data-period]');if(per){period=per.dataset.period;renderReports();return}let a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case'record':openRecord();break;case'close':close();break;case'save':saveTx();break;case'delete':deleteTx();break;case'type':document.getElementById('txType').value=a.dataset.type;document.querySelectorAll('[data-action="type"]').forEach(x=>x.classList.toggle('active',x.dataset.type===a.dataset.type));refreshDetect();break;case'prev':calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar();break;case'next':calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar();break;case'language':data.lang=data.lang==='en'?'zh':'en';save();renderAll();break;case'theme':data.dark=!data.dark;save();renderSettings();break;case'memory':resetMerchantMemory();break;
case'clear':
  if(confirm(tr('clearConfirm'))){
    const keep={currency:data.currency||'SGD',lang:data.lang||'en',dark:!!data.dark};
    data={tx:[],goals:[],currency:keep.currency,regular:0,fixed:0,lang:keep.lang,dark:keep.dark,merchantMemory:{}};
    try{localStorage.removeItem(KEY);localStorage.setItem(KEY,JSON.stringify(data));}catch(err){}
    editing=null;
    document.getElementById('modalBg')?.classList.remove('show');
    renderAll();
    toast(tr('cleared'));
  }
  break;}});
document.addEventListener('input',e=>{if(e.target.id==='txDescription')refreshDetect();if(e.target.id==='txCategory')e.target.dataset.manual='1';if(e.target.id==='smartInput')setSmartFromInput();if(e.target.id==='regular'||e.target.id==='fixed'){data[e.target.id]=Number(e.target.value)||0;save();renderHome()}});document.getElementById('currency').addEventListener('change',e=>{data.currency=e.target.value;save();renderAll()});document.getElementById('clearDataBtn')?.addEventListener('click',()=>{
  if(confirm(tr('clearConfirm'))){
    const keep={currency:data.currency||'SGD',lang:data.lang||'en',dark:!!data.dark};
    data={tx:[],goals:[],currency:keep.currency,regular:0,fixed:0,lang:keep.lang,dark:keep.dark,merchantMemory:{}};
    try{localStorage.removeItem(KEY);localStorage.setItem(KEY,JSON.stringify(data));}catch(err){}
    renderAll();toast(tr('cleared'));
  }
});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('modalBg').classList.contains('show')){if(e.target.id==='smartInput'){setSmartFromInput();if(document.getElementById('txAmount').value&&document.getElementById('txDescription').value)saveTx();}else if(e.target.id==='txDescription'||e.target.id==='txAmount')saveTx();}});document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')close()});renderAll();
</script></body></html>
